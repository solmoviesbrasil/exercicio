<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede sociais</title>
    <link rel="stylesheet" href="telefone2.css">
</head>
<body>
    <main>
        <section id="celular">

            <div id="container-celular">
                <img src="../fotos/frame-iphone.png" alt="Imagem Celular">

                <iframe src="../fotos/tela-home.jpg" frameborder="0" 
                referrerpolicy="no-referrer" sandbox="sandbox" name="frame" scrolling="no">

            </div>

        </section>
        <section id="rede-sociais">

            <ul>

                <li><a href="../fotos/tela-instagram.jpg" target="frame" rel="next"><img src="../fotos/logo-instagram.jpg" alt="Logo Instagram"></a></li>
                <li><a href="../fotos/tela-twitter.jpg" target="frame" rel="next"><img src="../fotos/logo-twitter.jpg" alt="Logo Twitter"></a></li>
                <li><a href="../fotos/tela-facebook.jpg" target="frame" rel="next"><img src="../fotos/logo-facebook.jpg" alt="Logo Facebook"></a></li>
            </ul>

        </section>
